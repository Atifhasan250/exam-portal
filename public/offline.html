<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050816">
    <title>Offline | IT Resource Zone</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #050816;
        --surface: #10172a;
        --surface-soft: #0b1020;
        --border: rgba(148, 163, 184, 0.24);
        --primary: #f8fafc;
        --secondary: #a7b2c5;
        --accent: #38bdf8;
        --accent-text: #03111f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 40px 16px;
        background: var(--bg);
        color: var(--primary);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(100%, 448px);
        padding: 32px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      }

      .icon-wrap {
        width: 80px;
        height: 80px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        background: var(--surface-soft);
        border: 1px solid var(--border);
        border-radius: 16px;
      }

      img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--surface-soft);
        color: var(--accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 20px 0 0;
        color: var(--primary);
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        margin: 14px 0 0;
        color: var(--secondary);
        font-size: 16px;
        line-height: 1.6;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }

      button,
      a {
        width: 100%;
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 20px;
        border-radius: 12px;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      button {
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-text);
        box-shadow: 0 12px 30px rgba(56, 189, 248, 0.22);
      }

      a {
        border: 1px solid var(--border);
        background: var(--surface-soft);
        color: var(--primary);
      }

      button:active,
      a:active {
        transform: scale(0.98);
      }

      @media (max-width: 420px) {
        main {
          padding: 28px 22px;
        }

        h1 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon-wrap">
        <img src="/icons/icon-192.png" alt="IT Resource Zone">
      </div>

      <div class="status">Offline</div>

      <h1>Connection needed</h1>
      <p>Exams, login, tasks, and progress sync need internet. Reconnect, then retry from the app.</p>

      <div class="actions">
        <button type="button" onclick="window.location.reload()">Retry</button>
        <a href="/">Home</a>
      </div>
    </main>
  </body>
</html>
